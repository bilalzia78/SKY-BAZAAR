<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Supplier - SKY BAZAAR</title>
<link rel="stylesheet" href="style9.css"><link rel="stylesheet" href="css.css">
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-storage-compat.js"></script>
<script src="firebase-config.js"></script><script src="saving.js"></script>
<style>
.info-box{background:#e8f5e9;border:1px solid #a5d6a7;padding:14px;border-radius:14px;margin:12px 0;font-size:13px;line-height:1.6}
.upload-box{border:2px dashed #0a1a3d;border-radius:14px;padding:14px;text-align:center;background:#f0f4ff}
.upload-box img{max-width:100%;max-height:180px;border-radius:10px;margin-top:10px;display:none}
.calc-box{background:#fff8e1;padding:12px;border-radius:12px;font-size:13px;margin:10px 0;line-height:1.8}
.progress-bar{width:100%;height:8px;background:#eee;border-radius:10px;overflow:hidden;display:none;margin-top:8px}
.progress-bar div{height:100%;width:0%;background:#0a7a42}
.welcome-box{background:#fff3cd;border:1px solid #ffe082;padding:12px;border-radius:12px;display:none;margin:12px 0}
.sop-check{width:18px;height:18px;accent-color:#0a7a42;vertical-align:middle;margin-right:6px}
#agreeAll{width:20px;height:20px;accent-color:#0a7a42;vertical-align:middle;margin-right:6px}
#submitBtn:disabled{background:#ccc!important;color:#666!important;cursor:not-allowed}
.hidden{display:none!important}
.sky-hero{background:linear-gradient(135deg,#0a1a3d 0%,#143a8a 60%,#0a1a3d 100%);color:#fff;padding:24px 16px;text-align:center;border-radius:18px;margin:12px 0}
.sky-hero h1{font-size:28px;margin:8px 0}
.sky-hero h1 span{color:#ffd700}
.sky-hero p{opacity:.85;font-size:14px;line-height:1.5;margin:0}
.sky-badge{display:inline-block;background:#ffd700;color:#0a1a3d;font-size:11px;font-weight:800;padding:6px 12px;border-radius:20px}
.sky-steps{display:flex;gap:8px;margin:14px 0}
.sky-steps div{flex:1;text-align:center;font-size:12px;font-weight:700;color:#999}
.sky-steps div b{width:36px;height:36px;border-radius:50%;background:#e8ecf3;display:flex;align-items:center;justify-content:center;margin:0 auto 6px;color:#999;font-size:15px}
.sky-steps div.on{color:#0a1a3d}
.sky-steps div.on b{background:#0a1a3d;color:#ffd700}
.sky-progress{height:10px;background:#e8ecf3;border-radius:20px;overflow:hidden}
.sky-progress i{display:block;height:100%;background:#ffd700;transition:.3s}
.sky-warn{background:#fff7d6;border:1px solid #ffe27a;padding:12px;border-radius:12px;font-size:13px;line-height:1.6}
</style></head>
