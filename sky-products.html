<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>SKY Official Products</title><link rel="stylesheet" href="style9.css"><script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script><script src="firebase-config.js"></script><style>body{font-family:Arial;background:#f1f5f9;margin:0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:14px;max-width:1100px;margin:auto}.card{background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 2px 8px #0001}.card img{width:100%;height:180px;object-fit:cover}.card div{padding:10px}.price{color:green;font-weight:800}.btn{width:100%;padding:10px;background:#ffd700;border:none;border-radius:8px;font-weight:700;margin-top:6px;cursor:pointer}.badge{background:#ffd700;color:#0a1a3d;padding:3px 8px;border-radius:20px;font-size:11px;font-weight:800}</style></head><body>
<div style="background:#0a1a3d;color:#fff;text-align:center;padding:20px"><h2 style="margin:0">👑 SKY OFFICIAL PRODUCTS</h2><p style="margin:5px;color:#ffd700">100% Original - By SKY BAZAAR</p><a href="index.html" style="color:#fff">← Home Wapis</a> | <a href="products.html" style="color:#ffd700">Supplier Products Dekho</a></div>
<div id="grid" class="grid">Loading...</div>
<script>async function load(){let s=await firebase.firestore().collection('sky_products').get();let h='';s.forEach(d=>{let p=d.data();h+='<div class="card"><img src="'+p.img+'"><div><span class="badge">👑 SKY OFFICIAL</span><br><br><b>'+p.name+'</b><br><span style="font-size:12px;color:#888">'+p.category+'</span><br><span class="price">Rs. '+p.price+'</span> '+(p.oldPrice?'<del style="color:#999">Rs. '+p.oldPrice+'</del>':'')+'<p style="font-size:12px">'+(p.description||'')+'</p><button class="btn" onclick="orderNow(\''+p.name+'\','+p.price+')">🛒 Order Karo</button></div></div>'});document.getElementById('grid').innerHTML=h||'<p style="text-align:center">Abhi koi product nahi, jald aa raha hai...</p>'}function orderNow(n,p){let msg='Salam! Mujhe SKY Official Product chahiye: '+n+' - Rs. '+p;window.open('https://wa.me/923110482356?text='+encodeURIComponent(msg),'_blank')}load();</script></body></html>
